# In-memory H2 so the whole test suite runs without MySQL or Keycloak.
# NON_KEYWORDS=DATE lets the Competition.date column keep its name in H2.
spring.datasource.url=jdbc:h2:mem:winter;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DATE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy issuer keys; the resource server decoder is never actually called in
# tests (security tests use spring-security-test's jwt() post-processor).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9/dummy/certs
