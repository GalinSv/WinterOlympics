spring.application.name=winterolympics
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/winter_olympics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
app.jwt.secret=${JWT_SECRET:winter-olympics-development-secret-change-me}
app.jwt.expiration-seconds=86400