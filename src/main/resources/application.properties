spring.application.name=winterolympics
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/winter_olympics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081

# Keycloak OAuth2 resource server: validate access tokens with the realm's
# public keys (lazy fetch, so the app still boots if Keycloak is down).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8080/realms/winter-olympics/protocol/openid-connect/certs}