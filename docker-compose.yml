version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: winter-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: winter_olympics

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:25.0

    container_name: winter-keycloak

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    command: start-dev

    ports:
      - "8080:8080"

volumes:
  mysql_data: